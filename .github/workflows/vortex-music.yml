name: Vortex Music

# Builds the separate Vortex Music player APK and publishes it to the
# `music-latest` release (stable link, same pattern as the launcher).

on:
  push:
    branches: [ "v3_openjdk", "arena/**" ]
    paths:
      - "vortexmusic/**"
      - ".github/workflows/vortex-music.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vortex-music
  cancel-in-progress: true

env:
  APK_NAME: Vortex.Music.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Vortex Music
        run: |
          if ! ./gradlew :vortexmusic:assembleDebug --console=plain > /tmp/music.log 2>&1; then
            grep -E "^e: |error: |FAILURE|What went wrong" /tmp/music.log | head -30 | cut -c1-300 | while IFS= read -r l; do
              echo "::error title=music::$l"
            done
            tail -40 /tmp/music.log
            exit 1
          fi

      - name: Publish to music-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="vortexmusic/build/outputs/apk/debug/vortexmusic-debug.apk"
          test -f "$APK"
          STAGE="$(mktemp -d)"
          cp "$APK" "$STAGE/$APK_NAME"
          SHA256="$(sha256sum "$STAGE/$APK_NAME" | cut -d' ' -f1)"
          {
            echo "Vortex Music v1.0.0 (debug build)"
            echo ""
            echo "- **Direct download:** [\`$APK_NAME\`](https://github.com/$GITHUB_REPOSITORY/releases/download/music-latest/$APK_NAME)"
            echo "- **SHA-256:** \`$SHA256\`"
          } > "$STAGE/NOTES.md"
          TAG="music-latest"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$STAGE/$APK_NAME"
            gh release edit "$TAG" --title "Vortex Music" --notes-file "$STAGE/NOTES.md"
          else
            gh release create "$TAG" --prerelease --title "Vortex Music" \
              --notes-file "$STAGE/NOTES.md" "$STAGE/$APK_NAME"
          fi
          echo "::notice title=vortex-music::https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
