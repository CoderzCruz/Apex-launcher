name: Aerix debug (testing)

# Builds the APK that all testing happens on and attaches it to the `debug-latest`
# GitHub Release (prerelease, so `releases/latest` stays on the public stable release).
# This workflow only ever builds the "noruntime" debug variant:
#   applicationId net.kdt.pojavlaunch.debug, signed with app_pojavlauncher/debug.keystore
# so it installs next to the public launcher and can never be mistaken for, or
# overwrite, a release APK. Public releases are built by release.yml / nightly.yml,
# which only run after a typed confirmation.

on:
  push:
    branches: [ "v3_openjdk", "arena/**" ]
    paths:
      - "app_pojavlauncher/src/**"
      - "app_pojavlauncher/*.gradle"
      - "app_pojavlauncher/proguard-rules.pro"
      - "app_pojavlauncher/libs/**"
      - "forge_installer/**"
      - "aerix_client_mod/**"
      - "tests/**"
      - "glfw/**"
      - "sdl/**"
      - "mojoexec/**"
      - "*.gradle"
      - "gradle/**"
      - "gradle.properties"
      - "version.properties"
      - "settings.gradle"
      - ".github/workflows/aerix-debug.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: aerix-debug
  cancel-in-progress: true

env:
  # One APK for every phone: the debug build carries both ARM architectures, so it installs
  # anywhere without a second file to choose between.
  APK_NAME: ApexLauncher1.0.apk
  APK_PATH: app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      # Optional brain for Apex Service. Add it under Settings → Secrets and variables →
      # Actions as "APEX_SERVICE_AI_KEY"; when it is missing the assistant still answers
      # from its built-in knowledge base, so the build never breaks without it.
      APEX_SERVICE_AI_KEY: ${{ secrets.APEX_SERVICE_AI_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Client smoke tests
        run: |
          python3 tests/branding_identity_smoke.py
          python3 tests/discord_presence_logo_smoke.py
          python3 tests/discord_game_handoff_smoke.py
          python3 tests/apex_owner_and_diwali_smoke.py
          python3 tests/public_chat_smoke.py
          python3 tests/public_chat_voice_badges_smoke.py
          python3 tests/apex_service_smoke.py
          python3 tests/modern_cape_smoke.py
          python3 tests/social_profile_cosmetics_smoke.py
          python3 tests/client_background_smoke.py
          python3 tests/crimson_noir_home_smoke.py
          python3 tests/nav_back_smoke.py
          mkdir -p "$RUNNER_TEMP/aerix-memory-test"
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/jre/InstanceMemory.java \
            tests/InstanceMemorySmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" InstanceMemorySmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientLogoMigration.java \
            tests/ClientLogoMigrationSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientLogoMigrationSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientVersions.java \
            tests/ClientVersionsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientVersionsSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientVersions.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientBootLabels.java \
            tests/ClientBootLabelsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientBootLabelsSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientVersionOptions.java \
            tests/ClientVersionOptionsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientVersionOptionsSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientOptionLines.java \
            tests/ClientOptionLinesSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientOptionLinesSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/game/FrameTimingStats.java \
            tests/FrameTimingStatsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" FrameTimingStatsSmokeTest
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror \
            -I app_pojavlauncher/src/main/jni/fps tests/frame_counter_smoke.c \
            app_pojavlauncher/src/main/jni/fps/frame_counter.c -o "$RUNNER_TEMP/aerix-frame-test"
          "$RUNNER_TEMP/aerix-frame-test"
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            aerix_client_mod/src/main/java/aerix/client/mod/ClientTelemetry.java tests/ModernTelemetrySmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" aerix.client.mod.ModernTelemetrySmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            aerix_client_mod/src/main/java/aerix/client/mod/ClientVisualOverrides.java \
            tests/ClientVisualOverridesSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" aerix.client.mod.ClientVisualOverridesSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/AdaptiveDistanceController.java \
            tests/AdaptiveDistanceSmokeTest.java \
            aerix_client_mod/src/main/java/aerix/client/mod/ClientAdaptiveDistance.java \
            tests/ClientAdaptiveDistanceSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" AdaptiveDistanceSmokeTest
          java -cp "$RUNNER_TEMP/aerix-memory-test" aerix.client.mod.ClientAdaptiveDistanceSmokeTest

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew :app_pojavlauncher:assembleNoruntimeDebug --console=plain > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "^e: |error: |CMake Error|CMake Generate step failed|FAILURE: |What went wrong|Caused by" -A5 build.log | sort -u | head -40 |
              while read -r l; do echo "::error title=gradle::$(printf '%s' "$l" | head -c 500)"; done
            # Kotlin diagnostics do not always match the patterns above, and the log endpoint is
            # not readable from every client, so the last 80 lines are surfaced as annotations.
            tail -80 build.log | while read -r l; do echo "::error title=log::$(printf '%s' "$l" | head -c 400)"; done
          fi
          exit "$code"

      - name: Check it is really the debug build
        id: verify
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT_DIR="$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BT_DIR"
          "$BT_DIR/zipalign" -c 4 "$APK_PATH"
          "$BT_DIR/apksigner" verify --verbose --min-sdk-version 23 --print-certs "$APK_PATH" | tee apksigner.txt
          BADGING="$("$BT_DIR/aapt2" dump badging "$APK_PATH" | head -n 1)"
          echo "$BADGING"
          [[ "$BADGING" == "package: name='net.kdt.pojavlaunch.debug' "* ]]
          echo "applicationId net.kdt.pojavlaunch.debug confirmed"
          VCODE="$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "::notice title=apk-verified::$BADGING"

      - name: Check the Apex Service key made it into the APK
        id: apexkey
        shell: bash
        # Never prints the key: only whether the build carries one. With no secret configured the
        # assistant still runs on its knowledge base, so this must not fail the build.
        run: |
          STATUS="$(python3 - <<'PY'
          import os, zipfile
          key = os.environ.get("APEX_SERVICE_AI_KEY", "").strip()
          if not key:
              print("NOT-CONFIGURED")
              raise SystemExit
          res = zipfile.ZipFile(os.environ["APK_PATH"]).read("resources.arsc")
          print("EMBEDDED" if (key.encode() in res or key.encode("utf-16-le") in res) else "MISSING")
          PY
          )"
          STATUS="$(printf '%s' "$STATUS" | tr -d '[:space:]')"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::notice title=apex-service::key $STATUS"
          test "$STATUS" != "MISSING"

      - name: Probe the Apex Service brain
        id: apexprobe
        shell: bash
        # Real call to the Gemini API with the saved key. Prints only status codes and the model
        # name, never the key, and never fails the build: a broken brain must not block an APK.
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request

          key = os.environ.get("APEX_SERVICE_AI_KEY", "").strip()
          base = "https://generativelanguage.googleapis.com/v1beta"
          summary = "no-key"
          if key:
              def call(url, payload=None):
                  data = json.dumps(payload).encode() if payload else None
                  req = urllib.request.Request(url, data=data, method="POST" if payload else "GET")
                  req.add_header("x-goog-api-key", key)
                  if payload:
                      req.add_header("Content-Type", "application/json")
                  try:
                      with urllib.request.urlopen(req, timeout=40) as r:
                          return r.status, json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      return e.code, {}
                  except Exception:
                      return 0, {}

              status, listing = call(f"{base}/models?pageSize=200")
              junk = ("tts", "image", "audio", "embedding", "aqa", "live", "native",
                      "video", "veo", "imagen", "learnlm", "robotics", "computer")
              models = [m.get("name", "").split("/")[-1] for m in listing.get("models", [])
                        if "generateContent" in m.get("supportedGenerationMethods", [])
                        and not any(j in m.get("name", "") for j in junk)]
              # Same ranking the app uses: newest version first, flash before others, stable
              # before preview and lite.
              def rank(name):
                  version = re.search(r"gemini-(\d+(?:\.\d+)?)", name)
                  return (
                      1 if "flash" in name else 0,
                      float(version.group(1)) if version else 0.0,
                      0 if "preview" in name else 1,
                      0 if "lite" in name else 1,
                  )
              ranked = sorted(models, key=rank, reverse=True)
              summary = f"models={status}/{len(models)}"
              # Ask the top few names the app would try, so the release notes show which ones
              # actually answer on this key.
              tried = []
              for pick in ranked[:6]:
                  code, body = call(f"{base}/models/{pick}:generateContent", {
                      "contents": [{"parts": [{"text": "Reply with OK only."}]}],
                      "generationConfig": {"thinkingConfig": {"thinkingLevel": "low"},
                                           "maxOutputTokens": 900},
                  })
                  text = ""
                  try:
                      text = body["candidates"][0]["content"]["parts"][0]["text"].strip()
                  except Exception:
                      text = ""
                  if text:
                      tried.append(f"{pick}:{code}:OK")
                  else:
                      err = ""
                      try:
                          err = str(body["error"]["message"])[:90].replace(" ", "_")
                      except Exception:
                          err = ""
                      tried.append(f"{pick}:{code}" + (f":{err}" if err else ""))
              if tried:
                  summary += " " + ",".join(tried)

          print("::notice title=apex-probe::" + summary.replace(":", " "))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("summary=" + summary + "\n")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aerix-debug-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Publish debug APK to GitHub Release (debug-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          AI_STATUS: ${{ steps.apexkey.outputs.status }}
          AI_PROBE: ${{ steps.apexprobe.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="debug-latest"
          SHORT="${GITHUB_SHA:0:7}"
          STAMPED_NAME="${APK_NAME%.apk}-$SHORT.apk"
          BUILT_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          STAGE="$(mktemp -d)"
          cp "$APK_PATH" "$STAGE/$APK_NAME"
          cp "$APK_PATH" "$STAGE/$STAMPED_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          SHA256="$(cut -d' ' -f1 "$STAGE/$APK_NAME.sha256")"
          {
            echo "kind: debug (testing only)"
            echo "name: $APK_NAME (universal, arm64 + arm32)"
            echo "stamped: $STAMPED_NAME"
            echo "branch: $GITHUB_REF_NAME"
            echo "commit: $GITHUB_SHA"
            echo "versionCode: $VERSION_CODE"
            echo "run: $GITHUB_RUN_ID"
            echo "built: $BUILT_AT"
            echo "sha256: $SHA256"
            echo "package: net.kdt.pojavlaunch.debug"
            echo "apex-service: $AI_STATUS"
            echo "note: side-by-side testing build; public stable releases live under v* tags"
          } > "$STAGE/DEBUG_BUILD.txt"
          {
            echo "Side-by-side testing build (\`net.kdt.pojavlaunch.debug\`) — installs next to the public launcher without touching its data."
            echo ""
            echo "- **Direct download:** [\`$APK_NAME\`](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME)"
            echo "- **Commit-stamped download (avoids browser filename cache):** [\`$STAMPED_NAME\`](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$STAMPED_NAME)"
            echo "- **Branch:** \`$GITHUB_REF_NAME\`"
            echo "- **Commit:** \`$SHORT\` (\`$GITHUB_SHA\`)"
            echo "- **versionCode:** \`$VERSION_CODE\`"
            echo "- **Built:** \`$BUILT_AT\`"
            echo "- **SHA-256:** \`$SHA256\`"
            echo "- **Apex Service brain:** \`$AI_STATUS\`"
            echo "- **Apex Service probe:** \`$AI_PROBE\`"
          } > "$STAGE/RELEASE_NOTES.md"

          # Anchor the tag ref to the root 2020 keystore commit so GitHub's /releases list
          # always sorts debug-latest below every public v* release and never touches the website.
          ANCHOR_SHA="cadb0ab12ff45b582927361b703df878b37e0221"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Prune previous commit-stamped APKs so only the latest pair remains on debug-latest.
            STAMPED_BASE="$(printf '%s' "${APK_NAME%.apk}" | sed 's/[.]/\\./g')"
            for old_asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E "^${STAMPED_BASE}-[0-9a-f]+\\.apk$" || true); do
              if [ "$old_asset" != "$STAMPED_NAME" ]; then
                gh release delete-asset "$TAG" "$old_asset" --yes || true
              fi
            done
            gh release upload "$TAG" --clobber \
              "$STAGE/$APK_NAME" \
              "$STAGE/$STAMPED_NAME" \
              "$STAGE/$APK_NAME.sha256" \
              "$STAGE/DEBUG_BUILD.txt"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$ANCHOR_SHA" -F force=true > /dev/null 2>&1 || true
            gh release edit "$TAG" \
              --prerelease \
              --title "Aerix Debug Build (latest)" \
              --notes-file "$STAGE/RELEASE_NOTES.md"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$ANCHOR_SHA" > /dev/null 2>&1 || true
            gh release create "$TAG" \
              --prerelease \
              --title "Aerix Debug Build (latest)" \
              --notes-file "$STAGE/RELEASE_NOTES.md" \
              "$STAGE/$APK_NAME" \
              "$STAGE/$STAMPED_NAME" \
              "$STAGE/$APK_NAME.sha256" \
              "$STAGE/DEBUG_BUILD.txt"
          fi
          rm -rf "$STAGE"
          echo "::notice title=debug-apk::https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME (versionCode $VERSION_CODE, from $SHORT)"
