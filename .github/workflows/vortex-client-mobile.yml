name: Vortex Client Mobile

# Builds the standalone Android Vortex Client app (separate APK from the launcher)
# and publishes it to the `client-mobile-latest` release.

on:
  push:
    branches: [ "v3_openjdk", "arena/**" ]
    paths:
      - "vortexclientapp/**"
      - ".github/workflows/vortex-client-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vortex-client-mobile
  cancel-in-progress: true

env:
  APK_NAME: Vortex.Client.Mobile.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Vortex Client Mobile
        run: |
          if ! ./gradlew :vortexclientapp:assembleDebug --console=plain > /tmp/vcm.log 2>&1; then
            grep -E "^e: |error: |FAILURE|What went wrong" /tmp/vcm.log | head -30 | cut -c1-300 | while IFS= read -r l; do
              echo "::error title=vcm::$l"
            done
            tail -40 /tmp/vcm.log
            exit 1
          fi

      - name: Publish to client-mobile-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="vortexclientapp/build/outputs/apk/debug/vortexclientapp-debug.apk"
          test -f "$APK"
          STAGE="$(mktemp -d)"
          cp "$APK" "$STAGE/$APK_NAME"
          SHA256="$(sha256sum "$STAGE/$APK_NAME" | cut -d' ' -f1)"
          {
            echo "Vortex Client Mobile1.0.0 — standalone Android client UI (own app, own icon)"
            echo ""
            echo "- **Direct download:** [\`$APK_NAME\`](https://github.com/$GITHUB_REPOSITORY/releases/download/client-mobile-latest/$APK_NAME)"
            echo "- **SHA-256:** \`$SHA256\`"
          } > "$STAGE/NOTES.md"
          TAG="client-mobile-latest"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$STAGE/$APK_NAME"
            gh release edit "$TAG" --title "Vortex Client (mobile)" --notes-file "$STAGE/NOTES.md"
          else
            gh release create "$TAG" --prerelease --title "Vortex Client (mobile)" \
              --notes-file "$STAGE/NOTES.md" "$STAGE/$APK_NAME"
          fi
          echo "::notice title=vcm::https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
